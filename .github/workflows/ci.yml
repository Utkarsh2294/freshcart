name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: freshcart
          POSTGRES_PASSWORD: freshcart_pass
          POSTGRES_DB: freshcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshcart -d freshcart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://freshcart:freshcart_pass@localhost:5432/freshcart
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify no TypeScript files
        run: |
          count=$(find . -name node_modules -prune -o \( -name '*.ts' -o -name '*.tsx' \) -print | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "ERROR: Found .ts/.tsx files!"
            find . -name node_modules -prune -o \( -name '*.ts' -o -name '*.tsx' \) -print
            exit 1
          fi

      - name: Run migrations
        run: node scripts/migrate.js

      - name: Seed database
        run: node scripts/seed.js

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Contract conformance
        run: npm run check:contracts

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build PWA
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify PWA cache busting
        run: npm run check:pwa

      - name: Verify production serving
        run: npm run check:production

      - name: Check formatting of changed files
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check

      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-compose-password
          JWT_SECRET: ci-compose-jwt-secret
          JWT_REFRESH_SECRET: ci-compose-refresh-secret
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Test Python services
        run: |
          python ai-services/input-understanding-service/test_nlu.py
          python ai-services/recommendation-service/test_scoring.py

      - name: Build production container
        run: docker build -f backend/Dockerfile -t freshcart:ci .

      - name: Verify container startup
        run: |
          docker run --rm --name freshcart-ci --network host -e DATABASE_URL -e JWT_SECRET -e JWT_REFRESH_SECRET -e NODE_ENV=production -e PORT=4000 -d freshcart:ci
          trap 'docker stop freshcart-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/api/health; then
              curl --fail --silent http://localhost:4000/ | grep -F '<title>Freshcart</title>'
              exit 0
            fi
            sleep 2
          done
          docker logs freshcart-ci
          exit 1
