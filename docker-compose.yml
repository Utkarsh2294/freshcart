services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshcart
      POSTGRES_PASSWORD: freshcart_pass
      POSTGRES_DB: freshcart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshcart"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://freshcart:freshcart_pass@postgres:5432/freshcart
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-12000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/backend/src
      - ./shared:/app/shared

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_SOCKET_URL: http://localhost:4000
    volumes:
      - ./frontend/src:/app/frontend/src
    command:
      ["npm", "run", "dev", "--workspace=frontend", "--", "--host", "0.0.0.0"]

  # Phase 2 — Recommendation Engine (self-hosted, no third-party AI)
  recommendation-service:
    build:
      context: ./ai-services/recommendation-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://freshcart:freshcart_pass@postgres:5432/freshcart
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 3 — Input Understanding Service (deterministic rule-based, no third-party AI)
  input-understanding-service:
    build:
      context: ./ai-services/input-understanding-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"

volumes:
  pgdata:
  redisdata:
